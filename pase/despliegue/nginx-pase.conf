# Sitio propio del conector del Pase. No toca los demás sitios del servidor.
# certbot --nginx agrega el bloque HTTPS y la redirección.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    client_max_body_size 1m;
    access_log /var/log/nginx/pase.access.log;
    error_log  /var/log/nginx/pase.error.log;

    location / {
        proxy_pass http://127.0.0.1:__PUERTO__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # El resumen interno solo desde el propio servidor
    location /admin/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:__PUERTO__;
    }
}
